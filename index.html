
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document rubrika</title>

    <!-- icons -->
    <script src="https://kit.fontawesome.com/daf6ff33d9.js" crossorigin="anonymous"></script>

    <!-- link bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<link rel="stylesheet" href="style.css">

</head>
<body>
<div class="page-grid">
<!--Header-->
<header class="container mt-4">

         <h1>Rubrica Telefonica!</h1>
    
</header>

<!-- Inizio di pagina; main -->
<main class="paginazione">
<section class="sez_form">

        <div class="container">
                <!-- input NOME  e PHONE-->
                
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 mb-3">

            

            <!-- form -->
<form class="form_container">
<div class="form-group">
        <h2 class="sotto_title">Aggiungi i contatti:</h2>
 
<label for="inputName" class="form_label">Nome:</label>
    <input type="text" id="inputName" class="inputName" placeholder="Nome">
        

<label for="inputPhone" class="form_label">Numero:</label>
<input type="text" id="inputPhone" class="inputPhone" placeholder="Numero">
      

<!-- BOTTONE -->
<div class="BTN_btn mt-4 d-flex justify-content-center">
    <p>Crea Contatto</p>
<button id="addBtn" class="btn btn-add" type="button">
            Aggiungi Contatti +
</button>
<!-- BUTTON MODIFICHI -->
<button id="editBtn" class="btn btn-edit" type="button">Modifica Contatto</button>
<!-- BOTTONE ELIMINAZIONE -->
<button id="deleteBtn" class="btn btn-delete" type="button">Elimina: <i class="fa-solid fa-trash"></i></button>
</div>
</div>
</div>
</div>
</div>
</form>
</section>


<div class="text-center justify-content-center my-4">
    <!-- Bottone mostrami / nascondimi contatto-i -->
    <button id="btnToggle" class="btn btn-toggle"><i class="fa-solid fa-magnifying-glass"></i>
        Mostra / Nascondi Contatti</button>
</div>
<section>
    <div class="col-md-8">
        <h2 class="sotto_title text-center mb-4 mt-5 py-6">I tuoi contatti</h2>
    </div>
</div>
</section>
        

<!-- DIV VUOTI PER INSERIMENTI -->
    
    <article class="contact-card">
    <section class="sez_contacts my-5 mt-5">
    <div class="row"  id="contactContainer"></div>
    </article>
</section>

</div>
</div>
</div>
</main>

</div>

<script src="./main.js"></script>


<!-- js -->
<!-- CamelCase per le propieta' di stile -->


    <!-- SCRIPT JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    
</body>
</html>
